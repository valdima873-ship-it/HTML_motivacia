:root{
  --bg:#0E0B09; --panel:#17120F; --card:#1E1814; --sunk:#120E0B;
  --line:#2C241E; --line2:#3B3129;
  --tx:#F5EEE7; --mut:#B8ACA1; --dim:#93877C;
  --org:#FF6B00; --org2:#FF8A33; --gold:#E9B44C;
  --grn:#4CC38A; --red:#F07272; --blu:#7EA8FF; --vio:#BBA0FF;
  --cocoa:#6B3E22; --cocoa2:#8A5430;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
a{color:var(--org2)}

/* top */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(14,11,9,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;background:none;border:0;padding:0;text-align:left}
.brand b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;color:var(--dim);font-size:11.5px}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;justify-content:center;scrollbar-width:none;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:14px;max-width:max-content;margin:0 auto}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;display:flex;align-items:center;gap:7px;height:38px;padding:0 11px;border-radius:10px;border:0;background:transparent;color:var(--mut);white-space:nowrap;font-weight:500;transition:background .15s,color .15s}
.nav button svg{width:17px;height:17px;flex-shrink:0}
.nav button:hover{color:var(--tx);background:#1C1612}
.nav button[aria-current=page]{background:#2B1E15;color:var(--tx);box-shadow:inset 0 0 0 1px #503829}
.nav button[aria-current=page] svg{color:var(--org)}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--org);color:#1A0A00;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.tact{display:flex;gap:8px;flex-shrink:0;align-items:center}
.me{display:flex;align-items:center;gap:8px;padding-left:8px;border-left:1px solid var(--line)}

/* buttons */
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:#5A4A3E}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--org);border-color:var(--org);color:#1A0A00;font-weight:600}
.btn.pri:hover{background:var(--org2);border-color:var(--org2)}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.xs{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.danger{color:#FFA3A3;border-color:#5A2A2A;background:transparent}
.btn.ok{color:#8BE3B4;border-color:#265A3E;background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon-btn{width:38px;height:38px;padding:0}

main{max-width:1440px;margin:0 auto;padding:24px 24px 60px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.ph p{margin:4px 0 0;color:var(--mut);max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
h2{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
h3{font-size:14px;margin:0;font-weight:600}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px;align-items:start}
.mt{margin-top:16px}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:6px;line-height:1.1}
.kpi .s{color:var(--mut);font-size:12.5px;margin-top:6px}
.mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:12.5px} .b{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.p-gray{background:#2A231E;color:#D9CDC2}.p-blue{background:#1B2540;color:#AFC8FF}.p-red{background:#3B1B1B;color:#FFA3A3}.p-amber{background:#3A2A10;color:#F5C76A}.p-green{background:#13301F;color:#86DFAE}.p-org{background:#3B1F09;color:#FFB27A}.p-vio{background:#2A1F3D;color:#D0BBFF}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:500;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;color:#24160C}
.av.lg{width:36px;height:36px;font-size:13px}

table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td.nw,td .row{white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#1C1612}
.scroll{overflow-x:auto}
.num{text-align:right;white-space:nowrap}
.bar{height:6px;background:#2C241E;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--org);border-radius:4px}

/* chocolate gauge — the signature */
.choco{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:4px;background:#24170F;border-radius:7px;box-shadow:inset 0 0 0 1px #3A2617}
.choco span{height:15px;border-radius:3px;background:linear-gradient(#93582F,#6B3E22);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,220,180,.14)}
.choco span.e{background:none;box-shadow:inset 0 0 0 1px #3B2A1E}
.choco.low span:not(.e){background:linear-gradient(#FF8A33,#C85200)}
.choco.sm span{height:9px}
.wrapper{width:10px;align-self:stretch;border-radius:3px}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:320px}
.colh{padding:4px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;width:100%;text-align:left;display:block;margin-bottom:8px;transition:border-color .15s}
.card:hover{border-color:#5A4A3E}
.card .t{font-weight:600;margin-top:9px}
.reqs{display:flex;gap:10px;margin-top:9px;font-size:11.5px}
.reqs .y{color:#86DFAE}.reqs .n{color:var(--dim)}

.seg{display:inline-flex;gap:2px;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:10px}
.seg button{height:30px;padding:0 11px;border-radius:7px;border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:#2B1E15;color:var(--tx)}

.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13px}
.chip[aria-pressed=true]{background:#2B1E15;border-color:#5A3F2C;color:var(--tx)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(6,4,3,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.mod{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:1000px;overflow:hidden}
.mod.anim{animation:pop .18s ease-out}
.mod.narrow{max-width:560px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.modb{display:flex;flex-wrap:wrap}
.modmain{flex:999 1 560px;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.modside{flex:1 1 300px;min-width:0;background:var(--sunk);border-left:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.f input,.f select,.f textarea,.inp{background:#0F0C0A;border:1px solid var(--line2);border-radius:9px;color:var(--tx);padding:9px 11px;min-height:40px;width:100%}
.f textarea{resize:vertical;min-height:64px}
.f.bad input,.f.bad select{border-color:#A04040}
.err{color:#FFA3A3;font-size:12px}
.req{color:#FFA3A3}
.opt{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;background:transparent;text-align:left;width:100%}
.opt[aria-pressed=true]{border-color:var(--org);background:#1F150E}
.opt .d{font-size:12px;color:var(--mut);margin-top:2px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--tx)}
.check input{accent-color:var(--org);width:16px;height:16px}
.stepper{align-self:flex-start;display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:#0F0C0A}
.stepper span{min-width:38px;text-align:center;font-weight:600}

/* cashback process */
.track{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));overflow-x:auto}
.stp{position:relative;padding:4px 12px 4px 0;background:none;border:0;text-align:left;color:inherit}
.stp::after{content:'';position:absolute;top:21px;left:42px;right:0;height:2px;background:var(--line2)}
.stp:last-child::after{display:none}
.stp .dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:#221A15;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stp.has .dot{border-color:var(--org);color:var(--org2);background:#25160B}
.stp[aria-pressed=true] .dot{background:var(--org);color:#1A0A00;border-color:var(--org)}
.stp .k{font-weight:600;margin-top:10px;font-size:13.5px}
.stp .w{font-size:12px;color:var(--mut)}
.stp .c{font-size:12px;margin-top:6px;color:var(--dim)}
.stp.has .c{color:#FFB27A}
.branch{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--mut)}
.branch span{display:inline-flex;align-items:center;gap:6px}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tli::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line2)}
.tli:last-child::before{display:none}
.tli .o{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim)}
.tli.done .o{background:#13301F;border-color:#2E6E4C;color:#86DFAE}
.tli.cur .o{background:var(--org);border-color:var(--org);color:#1A0A00}
.tli.skip .o{border-style:dashed}
.tli .ttl{font-weight:600}
.box{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.act{background:#1F150E;border:1px solid #5A3F2C;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* schedule */
.wk{display:grid;grid-template-columns:180px repeat(7,minmax(110px,1fr));min-width:980px}
.wk>div{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:96px;padding:6px}
.wk>.hd{min-height:auto;padding:10px 8px;font-size:12.5px;color:var(--mut)}
.wk>.nm{border-left:0;padding:12px 14px;display:flex;gap:9px;align-items:center}
.wk>.today{background:#21170F}
.ev{display:block;width:100%;text-align:left;border-radius:9px;padding:7px 9px;margin-bottom:5px;font-size:12.5px;border:1px solid transparent}
.ev .s{font-size:11.5px;opacity:.85;margin-top:1px}
.ev.plan{background:transparent;border-style:dashed}
.addc{width:100%;height:28px;border:1px dashed transparent;border-radius:8px;background:none;color:transparent;font-size:12px}
.wk>div:hover .addc{border-color:var(--line2);color:var(--dim)}

/* journal */
.jr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.jr:last-child{border-bottom:0}

/* podium */
.pod{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:12px;align-items:end}
.podc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.podc.first{border-color:#6A4A20;background:linear-gradient(#2A1E10,var(--card))}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;margin:12px 0}
.stack i{width:56px;height:9px;border-radius:3px;background:linear-gradient(#93582F,#6B3E22)}
.badge{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:7px;background:#2B1E15;color:#F2C9A0;font-weight:500}

.steps{display:flex;gap:6px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding-right:10px}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.steps .on{color:var(--tx)}.steps .on i{background:var(--org);border-color:var(--org);color:#1A0A00}
.steps .ok i{background:#13301F;border-color:#2E6E4C;color:#86DFAE}
.scanbox{position:relative;height:220px;border-radius:16px;background:#1A120C;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .fr{position:absolute;inset:30px 60px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,107,0,.9);pointer-events:none}
.scanbox .ln{position:absolute;left:70px;right:70px;top:50%;height:2px;background:var(--org);pointer-events:none}
.scanph{text-align:center;color:var(--mut);font-size:13px;max-width:34ch}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1.5px dashed var(--line2);border-radius:14px;cursor:pointer;color:var(--mut);text-align:center;padding:14px;font-size:13px}
.upl:hover{border-color:var(--org)}
.upl:focus-within{outline:2px solid var(--org);outline-offset:2px}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:0}
.rcpt{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#000;display:block}
.mapbox{height:640px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#14100D}
.minimap{height:230px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#14100D}
.leaflet-container{background:#14100D;font:inherit}
.leaflet-bar a,.leaflet-bar a:hover{background:#1E1814;color:var(--tx);border-color:#3B3129}
.leaflet-control-attribution{background:rgba(14,11,9,.82)!important;color:var(--dim)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-tooltip{background:#1E1814;border:1px solid #3B3129;color:var(--tx);border-radius:8px;box-shadow:none;font:12px/1.3 'Onest',sans-serif}
.leaflet-tooltip-top:before{border-top-color:#3B3129}
.mk{position:relative;width:34px;height:34px;border-radius:50%;background:var(--c);color:#24160C;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;border:3px solid #0E0B09;box-shadow:0 0 0 2px var(--org);font-family:'Onest',sans-serif}
.mk.mv::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--org);animation:ping 1.6s ease-out infinite}
.mk.off{box-shadow:0 0 0 2px #5A4A3E;filter:grayscale(.6)}
@keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(1.4);opacity:0}}
.mks{width:30px;height:30px;border-radius:9px;background:#2B1E15;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.mko{width:34px;height:34px;border-radius:10px;background:var(--org);border:3px solid #0E0B09;display:flex;align-items:center;justify-content:center}
.mkr{width:22px;height:22px;border-radius:50%;background:#86DFAE;border:3px solid #0E0B09;display:flex;align-items:center;justify-content:center;color:#0E2A1A;font-size:11px;font-weight:800}
.trip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.trip[aria-pressed=true]{border-color:var(--org)}
.alert{font-size:12px;color:#FFB27A;margin-top:6px}
.gpson{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#86DFAE}
.gpson::before{content:'';width:8px;height:8px;border-radius:50%;background:#4CC38A;box-shadow:0 0 0 3px rgba(76,195,138,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2B1E15;border:1px solid #5A3F2C;color:var(--tx);padding:12px 16px;border-radius:12px;z-index:80;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .2s}
.empty{padding:28px;text-align:center;color:var(--mut)}
.hide-sm{}
@media (max-width:1560px) and (min-width:761px){.nav button svg{display:none}.brand small{display:none}}
@media (max-width:1360px) and (min-width:761px){.brand span{display:none}.tact .btn{padding:0 11px}}
@media (max-width:1100px){.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.tact .btn{height:34px;padding:0 10px;font-size:13px}.brand small{display:none}.top{flex-wrap:wrap;padding:10px 14px}.nav{order:3;width:100%;max-width:100%;justify-content:flex-start}.hide-sm{display:none}main{padding:16px 14px 60px}.g4,.g3,.g2{grid-template-columns:1fr}.pod{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rolesel{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--tx);padding:0 10px;font:inherit;max-width:190px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.ln:last-child{border-bottom:0}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk .i{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.chk .ok{background:#13301F;color:#86DFAE}.chk .wr{background:#3A2A10;color:#F5C76A}.chk .er{background:#3B1B1B;color:#FFA3A3}
.neg{color:#FFA3A3}.pos{color:#86DFAE}
.pts{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.pts::before{content:'';width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFB27A,#FF6B00 60%,#B84D00);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.bal{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;border:1px solid #5A3F2C;background:#1F150E;font-size:14px}
.feed{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.feed:last-child{border-bottom:0}
.val{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600}
.react{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line2);background:transparent;font-size:12.5px;color:var(--mut)}
.react[aria-pressed=true]{border-color:var(--org);color:var(--tx);background:#1F150E}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
.podc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.podc.first{border-color:#6A4A20;background:linear-gradient(#2A1E10,var(--card))}
.podc .bar{height:8px;margin-top:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.item .pic{height:118px;display:flex;align-items:center;justify-content:center}
.item .pic svg{width:46px;height:46px}
.item .bd{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.lvl{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.lvl .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#1A0A00;flex-shrink:0}
.bd-card{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.bd-card:hover{border-color:#5A4A3E}
.bd-date{width:62px;height:62px;border-radius:14px;background:#2B1E15;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.bd-date b{font-size:22px}
.bd-date span{font-size:11.5px;color:var(--mut)}
.bd-date.today{background:var(--org);color:#1A0A00}.bd-date.today span{color:#3A1A00}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:14px}
.tli::before{content:'';position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line2)}
.tli:last-child::before{display:none}
.tli .o{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim)}
.tli.done .o{background:#13301F;border-color:#2E6E4C;color:#86DFAE}
.tli.cur .o{background:var(--org);border-color:var(--org);color:#1A0A00}
.wish{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);margin-bottom:6px}
.wish.taken{opacity:.55}
.sig{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:16px;background:#2B1E15;font-size:12.5px;margin:0 6px 6px 0}
.meter{height:10px;border-radius:5px;background:#2C241E;overflow:hidden}.meter i{display:block;height:100%;border-radius:5px}
.chal{background:linear-gradient(135deg,#2A1A0C,var(--panel));border:1px solid #5A3F2C;border-radius:16px;padding:18px}
.fieldrow{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}

    else if(l<0.05)out='transparent';
    else if(l<0.07)out='rgba(255,255,255,.62)';
    else if(l<0.09)out='rgba(255,255,255,.84)';
    else if(l<0.13)out='rgba(255,255,255,.94)';
    else out=`rgba(98,64,190,${(0.10+(l-0.13)*0.6).toFixed(3)})`;
   }else if(neutral&&l>=0.6)out=l>0.85?'#1E1442':'#5A4E82';
   else if(neutral)out='#8B80AA';
   else if(l<0.3)out=hsl(h,Math.min(1,s+0.3),0.9,a);
   else if(l>=0.6)out=hsl(h,Math.min(1,s+0.25),0.36,a);
   else out=hsl(h,Math.min(1,s+0.2),l,a);
  }
  cc.set(key,out);return out;
 }
 const mapText=(txt,t)=>t==='dark'?txt:txt.replace(RX,m=>mapColor(m,t));

 const EXTRA={
  dark:'',
  light:`html{color-scheme:light}.leaflet-container{background:#E9E5E0}.av{color:#24160C!important}`,
  bright:`html{color-scheme:light}
body{background:linear-gradient(135deg,#FFD6EA 0%,#E8DCFF 32%,#D3F0FF 64%,#FFF2C2 100%) fixed!important}
.top{background:rgba(255,255,255,.72)!important;backdrop-filter:blur(16px)}
.mod,.toast{background:#FFFFFF!important}
.panel,.kpi{box-shadow:0 10px 30px rgba(110,70,210,.10)}
.grid>.kpi:nth-child(4n+1){border-top:4px solid #FF4D8D!important}.grid>.kpi:nth-child(4n+2){border-top:4px solid #7C5CFF!important}.grid>.kpi:nth-child(4n+3){border-top:4px solid #00B4D8!important}.grid>.kpi:nth-child(4n+4){border-top:4px solid #FFB020!important}
.btn.pri{background:linear-gradient(90deg,#FF6B00,#FF3D9A)!important;border-color:transparent!important;color:#FFFFFF!important}
.nav button[aria-current=page]{background:linear-gradient(90deg,#FF6B00,#FF3D9A)!important;color:#FFFFFF!important;box-shadow:none!important}
.nav button[aria-current=page] .cnt{background:#FFFFFF!important;color:#FF3D9A!important}
.leaflet-container{background:#EFE9FF}
.av{color:#24160C!important}`,
 };

 let styleEl=null,orig='';
 function applyCSS(){if(!styleEl)return;styleEl.textContent=theme==='dark'?orig:mapText(orig,theme)+'\n'+EXTRA[theme]}
 const ATTRS=['style','fill','stroke','stop-color'];
 function proc(el){
  if(el.nodeType!==1||el.tagName==='SCRIPT'||el.tagName==='STYLE')return;
  if(el.classList.contains('av')||el.closest('.av'))return;
  for(const a of ATTRS){
   const v=el.getAttribute(a);if(v==null)continue;
   const mk='__m_'+a,ok='__o_'+a;
   if(el[mk]!==v)el[ok]=v;
   const nv=mapText(el[ok],theme);
   el[mk]=nv;if(nv!==v)el.setAttribute(a,nv);
  }
 }
 function procTree(root){if(root.nodeType!==1)return;proc(root);root.querySelectorAll('*').forEach(proc)}
 const obs=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(procTree);else proc(m.target)}});

 window.themeTile=()=>theme==='dark'?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':theme==='light'?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

 function ui(){
  const host=document.querySelector('.tact');if(!host||document.getElementById('themesw'))return;
  const w=document.createElement('div');w.id='themesw';w.setAttribute('role','group');w.setAttribute('aria-label','Тема оформления');
  w.style.cssText='display:flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);flex-shrink:0';
  w.innerHTML=THEMES.map(([k,l,bg,dot])=>`<button type="button" data-theme-set="${k}" title="Тема: ${l}" aria-label="Тема: ${l}" aria-pressed="${theme===k}" style="width:28px;height:28px;border-radius:8px;border:2px solid ${theme===k?'#FF6B00':'transparent'};background:${bg};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)"><i style="width:8px;height:8px;border-radius:50%;background:${dot};display:block"></i></button>`).join('');
  w.addEventListener('click',e=>{const b=e.target.closest('[data-theme-set]');if(b)set(b.dataset.themeSet)});
  host.insertBefore(w,host.firstChild);
 }
 function markUI(){document.querySelectorAll('[data-theme-set]').forEach(b=>{const on=b.dataset.themeSet===theme;b.setAttribute('aria-pressed',on);b.style.borderColor=on?'#FF6B00':'transparent'})}
 function set(t){
  theme=t;try{localStorage.setItem(KEY,t)}catch(e){}
  document.documentElement.dataset.theme=t;
  applyCSS();procTree(document.body);markUI();
  if(typeof render==='function'){try{const y=scrollY;render();scrollTo(0,y)}catch(e){}}
  if(typeof renderModal==='function'&&typeof st!=='undefined'&&st.modal){try{renderModal()}catch(e){}}
 }
 function init(){
  styleEl=document.querySelector('head style');orig=styleEl?styleEl.textContent:'';
  document.documentElement.dataset.theme=theme;
  ui();
  if(theme!=='dark'){applyCSS();procTree(document.body)}
  obs.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:ATTRS});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
